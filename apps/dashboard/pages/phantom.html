<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050608">
  <meta name="description" content="PHANTOM — Core Intelligence Architecture. Spatial intelligence layer and ecosystem constellation.">
  <title>PHANTOM — Core Intelligence Architecture</title>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/css/phantom-core.css?v=3.3.0">
  <script src="/src/lib/three.min.js?v=3.7.0"></script>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #050608;
      color: #f2f4f8;
      font-family: 'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
  </style>
</head>
<body data-page="phantom">
  <script src="/src/js/core/phantom-core.js?v=3.3.0"></script>
  <script>
    (function () {
      function boot() {
        if (window.PhantomCoreExperience) {
          window.PhantomCoreExperience.open();
        } else {
          setTimeout(boot, 20);
        }
      }
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', boot);
      } else {
        boot();
      }
    })();
  </script>
  <script type="module" src="/src/api/inspector.js"></script>
</body>
</html>
