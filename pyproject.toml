[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phantom"
version = "0.1.0"
description = "Ambient spatial memory for everyday life"
requires-python = ">=3.12"
dependencies = [
    "opencv-python>=4.8.0",
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.5.0",
    "ollama>=0.1.0",
    "openai>=1.3.0",
    "anthropic>=0.7.0",
    "rapidfuzz>=3.5.0",
    "pillow>=10.1.0",
    "numpy>=1.26.0",
    "sqlalchemy>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
    "black>=23.10.0",
    "mypy>=1.7.0",
]

[tool.setuptools.packages.find]
where = ["packages"]
include = ["core*", "sdk*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
pythonpath = ["."]
